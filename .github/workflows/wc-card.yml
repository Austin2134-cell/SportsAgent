name: World Cup Daily Card

on:
  # Manual trigger from GitHub UI — pick any date
  workflow_dispatch:
    inputs:
      date:
        description: "Card date (YYYY-MM-DD). Leave blank for today (Mountain Time)."
        required: false
        default: ""
      email:
        description: "Recipient email. Leave blank for default (Austin.noyes21@gmail.com)."
        required: false
        default: ""
      no_email:
        description: "Skip email delivery and just print to log?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Auto-run daily at 8:50 AM Mountain Time (14:50 UTC during MDT / 15:50 UTC during MST)
  schedule:
    - cron: "50 14 * * *"

jobs:
  generate-card:
    name: Generate ESM World Cup Card
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Resolve card date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            # Today in Mountain Time (MDT = UTC-6)
            echo "date=$(TZ=America/Denver date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run World Cup card
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_SYNC_EMAIL: ${{ secrets.GOOGLE_SHEETS_SYNC_EMAIL }}
          TIMEZONE: America/Denver
        run: |
          DATE="${{ steps.date.outputs.date }}"
          EMAIL_ARG=""
          if [ -n "${{ github.event.inputs.email }}" ]; then
            EMAIL_ARG="--email ${{ github.event.inputs.email }}"
          fi
          NO_EMAIL_ARG=""
          if [ "${{ github.event.inputs.no_email }}" = "true" ]; then
            NO_EMAIL_ARG="--no-email"
          fi

          python run_world_cup_card.py \
            --date "$DATE" \
            $EMAIL_ARG \
            $NO_EMAIL_ARG
