# Repo-root config when Railway service root directory is NOT set to backend/.
# In Railway → Service → Settings, either:
#   A) Set Root Directory = backend  (uses backend/railway.toml), OR
#   B) Leave root at / and use this file (builds backend/Dockerfile).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
